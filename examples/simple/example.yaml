# FlukaToolkit — one config drives a whole simulation (schema v2).
#
# `general` holds everything the tools share; each tool section keeps only what
# is specific to it and falls back to `general` for the rest.

general:
  input: example.inp        # FLUKA .inp (one #define per grid key + RANDOMIZ/START)
  backend: ts               # ts | slurm | lsf | condor  (used by grid + submit)
  output: results/          # per-combo run dirs are created under here
  primaries: 1000           # optional — overrides the START primary count
  use_dpm: false            # true → rfluka -d (DPMJET/RQMD); exclusive with custom_executable
  # custom_executable: null # optional — rfluka -e <exe>
  # rfluka_path: null       # optional — explicit rfluka bin dir

# ── fluka-submit : the single source of batch resources (used by submit AND grid) ──
submit:
  njobs: 2                  # submit-standalone: independent seeded jobs of `input`
  max_parallel: 10          # ts slot count (local concurrency)
  mem: "1500"               # MB
  time: "1-00:00:00"        # slurm/lsf time limit D-HH:MM:SS
  ntasks: 1
  nodes: 1
  gres: "disk:1G"           # slurm
  ncpu: 1                   # condor
  disk: 100000              # condor request_disk (kB)
  condor_max_runtime: 86400 # condor +MaxRuntime (s)
  queue: null               # partition (slurm) / queue (lsf) / universe (condor)
  farm_out: /farm_out       # slurm: accessible out/err/sentinel dir

# ── fluka-grid : expand a parameter grid over the input, seed, submit ──
grid:
  parameters:               # each key MUST match a `#define <key>` in example.inp
    irrtime: [86400, 172800]        # seconds
    current: [6.24E+15, 6.24E+16]   # particles/s
    # mat: [COPPER, TUNGSTEN]
  runs_per_combo: 2          # independent runs per combination (unique seeds)

# ── fluka-compile : compile the FLUKA ROOT-output executable ──
custom_exe:
  rntuple: false            # false → FluLib (TTree); true → FluLibRNTuple (RNTuple)
  routines: [src/root_output/routines/mgdraw.f]      # overrides default usrini/usrout/mgdraw; extras compiled too

# ── fluka-analysis : RESNUCLEi → per-isotope activity/mass → Excel ──
analysis:
  run: c1/run_0001          # relative to general.output → results/c1/run_0001
  units: [21, 22]           # RESNUCLE detector units in example.inp
  volume: 1000              # cm³
  isotopes:                 # Z: A
    31: 70
    30: 69
  output: isotopes.xlsx
