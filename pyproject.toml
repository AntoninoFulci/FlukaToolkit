[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "flukatoolkit"
version = "0.1.0"
description = "Unified FLUKA toolkit: grid generation, batch submission, isotope inventory, ROOT output"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "pandas",
    "openpyxl",
    "periodictable",
    "radioactivedecay",
    "colorama",
    "tabulate",
    "rich",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "build>=1",
    "ruff>=0.8",
    "mypy>=1.13",
]
htcondor = ["htcondor"]

[project.urls]
Repository = "https://github.com/AntoninoFulci/FlukaToolkit"
Issues = "https://github.com/AntoninoFulci/FlukaToolkit/issues"

[project.scripts]
fluka-grid     = "fluka.cli.grid:main"
fluka-submit   = "fluka.cli.submit:main"
fluka-analysis = "fluka.cli.analysis:main"
fluka-compile  = "fluka.cli.compile:main"
fluka-run      = "fluka.run.orchestrator:main"
fluka-status   = "fluka.cli.status:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["fluka*"]

[tool.setuptools.package-data]
fluka = ["root_output/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.mypy]
python_version = "3.10"
files = ["src/fluka/queue", "src/fluka/run", "src/fluka/cli"]
ignore_missing_imports = true
no_site_packages = true
check_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["fluka.isotope_inventory", "fluka.isotope_inventory.*"]
follow_imports = "skip"

[tool.coverage.run]
source = ["fluka"]

[tool.coverage.report]
show_missing = true
skip_covered = true
